services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: racelab
      POSTGRES_PASSWORD: local-racelab
      POSTGRES_DB: racelab
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - racelab-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racelab"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  racelab-data:
